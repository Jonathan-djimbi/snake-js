<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stardew Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div class="game-container">
        <div class="ui-header">
            <div class="season-display" id="seasonDisplay">Spring</div>
            <div class="score-display" id="scoreDisplay">0g</div>
        </div>

        <div class="mainContainer">
            <div id="canvasDiv"></div>
            <!-- Mobile Controls Overlay (Optional, for visual feedback) -->
        </div>

        <div class="ui-footer">
            <div class="btnContainer">
                <button class="container" id="left">&#8592</button>
                <div class="upDown">
                    <button class="container" id="up">&#8593</button>
                    <button class="container" id="down">&#8595</button>
                </div>
                <button class="container" id="right">&#8594</button>
            </div>
            <div class="space"><button class="container" id="space">RESET</button></div>
        </div>
    </div>
</body>

</html>
